<!-- BRANCHES -->
<section id="branches" class="max-w-7xl mx-auto px-6 lg:px-12 py-20 reveal">

    <div class="mb-14">

        <span class="text-sm uppercase tracking-[0.2em] text-zinc-500 font-semibold">
            Sucursales
        </span>

        <h2 class="text-4xl lg:text-5xl font-black mt-3">
            Puntos de venta activos
        </h2>

        <p class="text-zinc-600 text-lg leading-relaxed mt-4 max-w-2xl">
            Ubicaciones donde puedes encontrar productos disponibles actualmente.
            Cada punto está verificado y actualizado para una mejor experiencia.
        </p>

    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">

        <!-- LISTA DE BRANCHES -->
        <div class="space-y-6">

            @for (b of branches; track b.name) {

            <div class="group relative rounded-[2rem] border border-zinc-200 bg-white p-6
         transition-all duration-300 cursor-pointer
         hover:-translate-y-1 hover:shadow-xl hover:border-zinc-300
         active:scale-[0.99]" (click)="focusBranch(b)">

                <!-- HEADER -->
                <div class="flex items-start justify-between gap-4">

                    <h3 class="text-xl font-black text-zinc-900 leading-tight">
                        {{ b.name }}
                    </h3>

                    <span class="w-2.5 h-2.5 rounded-full bg-zinc-200 group-hover:bg-black transition"></span>

                </div>

                <!-- DESCRIPTION -->
                <p class="text-zinc-600 mt-3 text-sm leading-relaxed">
                    {{ b.description }}
                </p>

                <!-- TAGS -->
                <div class="flex gap-2 mt-5 flex-wrap">
                    @for (t of b.tags; track t) {
                    <span class="text-[11px] px-3 py-1.5 rounded-full
               bg-zinc-50 border border-zinc-200
               text-zinc-600
               group-hover:border-zinc-300 group-hover:bg-zinc-100
               transition">
                        {{ t }}
                    </span>
                    }
                </div>

                <!-- ACTION -->
                <div class="mt-6 flex items-center justify-between">

                    <div class="text-xs text-zinc-400 group-hover:text-zinc-600 transition">
                        <iconify-icon icon="lucide:map-pin"></iconify-icon>
                    </div>

                    <button class="inline-flex items-center gap-2 text-xs font-semibold
                        px-4 py-2 rounded-full cursor-pointer
                        bg-black text-white
                        hover:bg-zinc-800 hover:shadow-md
                        active:scale-95
                        transition-all duration-200" (click)="openRoute(b); $event.stopPropagation()">
                        <iconify-icon icon="lucide:route" class="w-4 h-4"></iconify-icon>
                        Cómo llegar
                    </button>

                </div>

            </div>

            }

        </div>

        <!-- MAPA MOCK / VISUAL -->
        <div class="relative">

            <div class="rounded-[2.5rem] overflow-hidden border border-zinc-200 shadow-sm bg-zinc-100">

                <div id="map" class="w-full h-[500px] rounded-2xl border cursor-grab active:cursor-grabbing"></div>

            </div>
        </div>

    </div>

</section>
